services:
  postgres:
    image: postgres:16-alpine
    container_name: tn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tn
      POSTGRES_PASSWORD: tn
      POSTGRES_DB: tn
    ports:
      - "5432:5432"
    volumes:
      - tn-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tn -d tn"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tn-postgres-data:
